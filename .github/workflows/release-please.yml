name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.release_created == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.release_created == 'true'
        with:
          node-version: "24.12.0"
          package-manager-cache: false
      - name: Verify bot PRs and prepare tagged artifacts explicitly
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PULL_REQUESTS: ${{ steps.release.outputs.prs || '[]' }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: node scripts/release/dispatch-release.mjs
