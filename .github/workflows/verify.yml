name: Verify
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Node ${{ matrix.node }} acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.3", "24.12.0", "24.21.0"]
    steps:
      - name: Checkout the exact proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false
          cache: true
      - name: Record commit and runtime
        run: |
          git rev-parse HEAD
          node --version
          pnpm --version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Job-local global cf
        run: npm install --global cf@1.0.0-beta.6 --registry=https://registry.npmjs.org/
      - name: Chromium
        run: pnpm --filter honoxpress-example exec playwright install --with-deps chromium
      - name: Full acceptance including packed external consumer
        run: pnpm verify
      - name: Snapshot successful evidence
        run: pnpm evidence
      - name: Keep diagnostics and evaluation tarball
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/
            packages/docs/evidence/
            examples/poc/evidence/
            examples/poc/dist/evidence/
            examples/poc/test-results/
          retention-days: 7
          if-no-files-found: warn
