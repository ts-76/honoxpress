packages:
  - packages/*
  - examples/*
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260930.2 || 1.20261102.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260930.2 || 1.20261102.1"
  - "@cloudflare/workerd-linux-64@1.20260930.2 || 1.20261102.1"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2 || 1.20261102.1"
  - "@cloudflare/workerd-windows-64@1.20260930.2 || 1.20261102.1"
  # Emergency security fix published 2026-11-01; re-evaluate once release age passes.
  - hono@4.13.16
  - miniflare@5.20260930.0-alpha || 5.20261102.0-beta
  - workerd@1.20260930.2 || 1.20261102.1
  - wrangler@4.145.0 || 4.156.2
  - "@shikijs/core@4.6.0"
  - "@shikijs/engine-javascript@4.6.0"
  - "@shikijs/engine-oniguruma@4.6.0"
  - "@shikijs/langs@4.6.0"
  - "@shikijs/primitive@4.6.0"
  - "@shikijs/themes@4.6.0"
  - "@shikijs/types@4.6.0"
  - shiki@4.6.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  hono: 4.13.16
  # PostCSS permits this patched release; prevent the vulnerable locked copy.
  "source-map-js@<1.2.2": 1.2.2
  vite-plus: "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
