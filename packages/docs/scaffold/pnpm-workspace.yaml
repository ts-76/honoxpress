allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260930.2"
  - "@cloudflare/workerd-darwin-arm64@1.20260930.2"
  - "@cloudflare/workerd-linux-64@1.20260930.2"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2"
  - "@cloudflare/workerd-windows-64@1.20260930.2"
  # Emergency security fix published 2026-11-01; re-evaluate once release age passes.
  - hono@4.13.16
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
  - wrangler@4.145.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  # PostCSS permits this patched release; prevent the vulnerable locked copy.
  "source-map-js@<1.2.2": 1.2.2
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
